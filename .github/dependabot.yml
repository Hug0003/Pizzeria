# Mises à jour de sécurité automatiques (pull requests hebdomadaires).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /pizzeria
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /pizzeria
    schedule:
      interval: weekly
